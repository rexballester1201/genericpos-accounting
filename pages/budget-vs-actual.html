<div data-module="budget-vs-actual">
  <div class="page-head no-print">
    <div>
      <h1>Budget vs actual</h1>
      <p class="sub" data-sub>&nbsp;</p>
    </div>
    <div class="row gap-2">
      <button class="btn btn-secondary" type="button" data-csv><span data-icon="download-simple" data-icon-size="18"></span>Download CSV</button>
      <button class="btn" type="button" data-print><span data-icon="printer" data-icon-size="18"></span>Print</button>
    </div>
  </div>
  <div class="card card-flush report-controls no-print">
    <form class="toolbar" data-controls novalidate></form>
  </div>
  <div class="alert alert-warn mb-4 no-print" data-warn hidden></div>
  <article class="report-sheet" data-sheet><div class="loading-block"><div class="spinner"></div></div></article>
</div>
