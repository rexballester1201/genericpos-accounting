<div data-module="statement-of-account">
  <div class="page-head no-print">
    <div>
      <h1>Statement of account</h1>
      <p class="sub" data-sub>Everything charged and paid in the period, with the balance to carry — the statement you send a customer, or ask a supplier to check.</p>
    </div>
    <div class="row gap-2">
      <button class="btn btn-secondary" type="button" data-csv><span data-icon="download-simple" data-icon-size="18"></span>Download CSV</button>
      <button class="btn" type="button" data-print><span data-icon="printer" data-icon-size="18"></span>Print</button>
    </div>
  </div>

  <div class="card card-flush report-controls no-print">
    <form class="toolbar" data-filters novalidate>
      <div class="segmented" role="group" aria-label="Customer or supplier" data-sides>
        <button type="button" data-side="ar">Customer</button>
        <button type="button" data-side="ap">Supplier</button>
      </div>
      <select class="select" name="contact_id" id="soa-contact" aria-label="Who" style="min-width:16em"></select>
      <select class="select" name="preset" id="soa-preset" aria-label="Period" style="width:auto"></select>
      <input class="input" type="date" name="from" id="soa-from" aria-label="From" style="width:auto" />
      <span class="faint">to</span>
      <input class="input" type="date" name="to" id="soa-to" aria-label="To" style="width:auto" />
    </form>
  </div>

  <article class="report-sheet" data-sheet><div class="loading-block"><div class="spinner"></div></div></article>
</div>
