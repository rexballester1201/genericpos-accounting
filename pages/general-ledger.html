<div data-module="general-ledger">
  <div class="page-head no-print">
    <div>
      <h1>General ledger</h1>
      <p class="sub" data-sub>An account's posted entries, with a running balance from the balance brought forward.</p>
    </div>
    <div class="row gap-2">
      <button class="btn btn-secondary" type="button" data-csv disabled><span data-icon="download-simple" data-icon-size="18"></span>Download CSV</button>
      <button class="btn" type="button" data-print disabled><span data-icon="printer" data-icon-size="18"></span>Print</button>
    </div>
  </div>
  <div class="card card-flush report-controls no-print">
    <form class="toolbar" data-controls novalidate>
      <select class="select" name="account" id="gl-account" aria-label="Account" style="width:auto;max-width:100%;min-width:min(320px,100%)"></select>
      <select class="select" name="preset" id="gl-preset" aria-label="Period" style="width:auto"></select>
      <input class="input" type="date" name="from" id="gl-from" aria-label="From" style="width:auto" />
      <span class="faint">to</span>
      <input class="input" type="date" name="to" id="gl-to" aria-label="To" style="width:auto" />
      <div class="row gap-1">
        <button class="btn btn-ghost btn-sm" type="button" data-step="-1" aria-label="Previous account with entries" title="Previous account with entries"><span data-icon="caret-left" data-icon-size="16"></span></button>
        <button class="btn btn-ghost btn-sm" type="button" data-step="1" aria-label="Next account with entries" title="Next account with entries"><span data-icon="caret-right" data-icon-size="16"></span></button>
      </div>
    </form>
  </div>
  <article class="report-sheet" data-sheet><div class="loading-block"><div class="spinner"></div></div></article>
</div>
