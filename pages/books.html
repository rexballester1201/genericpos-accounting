<div data-module="books">
  <div class="page-head no-print">
    <div>
      <h1>Books of accounts</h1>
      <p class="sub" data-sub>Posted entries book by book, in date and number order.</p>
    </div>
    <div class="row gap-2">
      <button class="btn btn-secondary" type="button" data-csv><span data-icon="download-simple" data-icon-size="18"></span>Download CSV</button>
      <button class="btn" type="button" data-print><span data-icon="printer" data-icon-size="18"></span>Print</button>
    </div>
  </div>
  <div class="card card-flush report-controls no-print">
    <form class="toolbar" data-controls novalidate>
      <select class="select" name="book" id="bk-book" aria-label="Book" style="width:auto"></select>
      <select class="select" name="preset" id="bk-preset" aria-label="Period" style="width:auto"></select>
      <input class="input" type="date" name="from" id="bk-from" aria-label="From" style="width:auto" />
      <span class="faint">to</span>
      <input class="input" type="date" name="to" id="bk-to" aria-label="To" style="width:auto" />
      <select class="select" name="per_page" id="bk-per" aria-label="Entries per page" style="width:auto">
        <option value="50">50 entries a page</option>
        <option value="200">200 entries a page</option>
        <option value="500">500 entries a page</option>
      </select>
    </form>
  </div>
  <article class="report-sheet" data-sheet><div class="loading-block"><div class="spinner"></div></div></article>
  <div class="no-print mt-3" data-pager hidden></div>
</div>
