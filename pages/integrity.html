<div data-module="integrity">
  <div class="page-head no-print">
    <div>
      <h1>Integrity check</h1>
      <p class="sub">Checks, from the stored records, that the books still add up: every entry balances, numbers run without gaps, receivables and payables name their customer or supplier, documents agree with their entries, bank matches and depreciation add up. It changes nothing.</p>
    </div>
    <div class="row gap-2">
      <button class="btn btn-secondary" type="button" data-rerun><span data-icon="arrows-clockwise" data-icon-size="18"></span>Run again</button>
      <button class="btn btn-secondary" type="button" data-csv><span data-icon="download-simple" data-icon-size="18"></span>Download CSV</button>
      <button class="btn" type="button" data-print><span data-icon="printer" data-icon-size="18"></span>Print</button>
    </div>
  </div>
  <article class="report-sheet" data-sheet><div class="loading-block"><div class="spinner"></div></div></article>
</div>
