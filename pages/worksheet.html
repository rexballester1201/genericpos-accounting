<div data-module="worksheet">
  <div class="page-head no-print">
    <div>
      <h1>Worksheet</h1>
      <p class="sub" data-sub>The ten-column worksheet: the trial balance, the adjusting entries, the adjusted trial balance, and where each balance goes — the income statement or the balance sheet.</p>
    </div>
    <div class="row gap-2">
      <button class="btn btn-secondary" type="button" data-csv><span data-icon="download-simple" data-icon-size="18"></span>Download CSV</button>
      <button class="btn" type="button" data-print><span data-icon="printer" data-icon-size="18"></span>Print</button>
    </div>
  </div>
  <div class="card card-flush report-controls no-print">
    <form class="toolbar" data-filters novalidate>
      <label class="row gap-2 small" for="ws-date">As of <input class="input" type="date" id="ws-date" name="as_of" style="width:auto" /></label>
    </form>
  </div>
  <article class="report-sheet is-wide" data-sheet><div class="loading-block"><div class="spinner"></div></div></article>
</div>
