<div data-module="documents">
  <div class="page-head">
    <div>
      <h1 data-title>Invoices</h1>
      <p class="sub" data-sub>&nbsp;</p>
    </div>
    <div class="row gap-2" data-actions></div>
  </div>

  <div class="card card-flush">
    <div class="tabs" role="tablist" aria-label="Status" data-tabs style="padding:0 var(--s3)"></div>
    <form class="toolbar" data-filters role="search" novalidate>
      <div class="input-icon search">
        <span data-icon="magnifying-glass" data-icon-size="16"></span>
        <input class="input" type="search" name="q" id="dl-q" placeholder="Number, reference or name" aria-label="Search" autocomplete="off" />
      </div>
      <select class="select" name="type" id="dl-type" aria-label="Kind" style="width:auto"></select>
      <select class="select" name="state" id="dl-state" aria-label="Payment" style="width:auto">
        <option value="">Paid or not</option>
        <option value="open">Open</option>
        <option value="overdue">Overdue</option>
        <option value="paid">Paid</option>
      </select>
      <select class="select" name="contact_id" id="dl-contact" aria-label="Customer or supplier" style="width:auto;max-width:260px"></select>
      <input class="input" type="date" name="from" id="dl-from" aria-label="From date" style="width:auto" />
      <input class="input" type="date" name="to" id="dl-to" aria-label="To date" style="width:auto" />
    </form>
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr><th>Number</th><th>Date</th><th data-col-contact>Customer</th><th>Due</th><th>Status</th><th class="num">Total</th><th class="num">Open</th></tr>
        </thead>
        <tbody data-rows><tr><td colspan="7"><div class="loading-block"><div class="spinner"></div></div></td></tr></tbody>
        <tfoot data-foot></tfoot>
      </table>
    </div>
    <div data-pager hidden></div>
  </div>
</div>
