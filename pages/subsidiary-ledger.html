<div data-module="subsidiary-ledger">
  <div class="page-head no-print">
    <div>
      <h1 data-head>Subsidiary ledger</h1>
      <p class="sub" data-sub>&nbsp;</p>
    </div>
    <div class="row gap-2">
      <button class="btn btn-secondary" type="button" data-csv><span data-icon="download-simple" data-icon-size="18"></span>Download CSV</button>
      <button class="btn" type="button" data-print><span data-icon="printer" data-icon-size="18"></span>Print</button>
    </div>
  </div>

  <div class="card card-flush report-controls no-print">
    <form class="toolbar" data-filters novalidate>
      <div class="segmented" role="group" aria-label="Receivables or payables" data-sides>
        <button type="button" data-side="ar">Receivables</button>
        <button type="button" data-side="ap">Payables</button>
      </div>
      <label class="row gap-2 small" for="sl-date">As of <input class="input" type="date" id="sl-date" name="as_of" style="width:auto" /></label>
      <label class="check small" style="align-items:center"><input type="checkbox" name="zero" id="sl-zero" /> Show those with no balance</label>
    </form>
  </div>

  <article class="report-sheet" data-sheet><div class="loading-block"><div class="spinner"></div></div></article>
</div>
