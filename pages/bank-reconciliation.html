<div data-module="bank-reconciliation">
  <div class="page-head no-print">
    <div>
      <div class="breadcrumb"><a href="banking">Banking</a><span data-icon="caret-right" data-icon-size="12"></span><span>Bank reconciliation</span></div>
      <h1>Bank reconciliation</h1>
      <p class="sub" data-sub>&nbsp;</p>
    </div>
    <div class="row gap-2">
      <a class="btn btn-ghost" href="banking" data-open hidden><span data-icon="arrows-left-right" data-icon-size="18"></span>Open the statement</a>
      <button class="btn btn-secondary" type="button" data-csv><span data-icon="download-simple" data-icon-size="18"></span>Download CSV</button>
      <button class="btn" type="button" data-print><span data-icon="printer" data-icon-size="18"></span>Print</button>
    </div>
  </div>

  <div class="card card-flush report-controls no-print">
    <form class="toolbar" data-filters novalidate>
      <select class="select" name="bank" id="br-bank" aria-label="Bank account" style="width:auto"></select>
      <select class="select" name="statement" id="br-statement" aria-label="Statement" style="width:auto"></select>
    </form>
  </div>
  <div class="alert alert-warn mb-4 no-print" data-warn hidden></div>
  <article class="report-sheet" data-sheet><div class="loading-block"><div class="spinner"></div></div></article>
</div>
