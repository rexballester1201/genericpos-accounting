<div data-module="budgets">
  <div class="page-head">
    <div>
      <h1>Budgets</h1>
      <p class="sub" data-sub>Plans for each fiscal year, by account, department and month.</p>
    </div>
    <div class="row gap-2" data-actions></div>
  </div>

  <div class="card card-flush">
    <form class="toolbar" data-filters novalidate>
      <select class="select" name="fy" id="bg-fy" aria-label="Fiscal year" style="width:auto"></select>
      <span class="small muted" data-count></span>
    </form>
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr><th>Budget</th><th>Status</th><th class="num">Income</th><th class="num">Expenses</th><th class="num" data-net-head>Net income</th><th>Updated</th></tr>
        </thead>
        <tbody data-rows><tr><td colspan="6"><div class="loading-block"><div class="spinner"></div></div></td></tr></tbody>
      </table>
    </div>
  </div>
  <p class="small muted mt-3" data-foot></p>
</div>
